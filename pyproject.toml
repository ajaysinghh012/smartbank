[project]
name = "ebanking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "faker",
    "sqlalchemy",
    "psycopg2",
    "alembic",
]

[dependency-groups]
dev = [
    "isort",
    "ruff",
    "litecli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartbank"]